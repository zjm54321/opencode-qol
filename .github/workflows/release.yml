name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v2.1.4-qol)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build Linux kernel
        run: nix build --print-build-logs .#opencode
      - name: Package Linux runtime closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging
          package=$(readlink -f result)
          printf '%s\n' "$package" > staging/store-path
          mapfile -t closure < <(nix-store --query --requisites "$package")
          nix-store --export "${closure[@]}" > staging/closure.nar
          cp scripts/install.sh README.md LICENSE THIRD_PARTY_NOTICES.md staging/
          tar -C staging -czf dist/opencode-linux-x64.tar.gz .
          cp scripts/install.ps1 scripts/install.sh dist/
          (cd dist && sha256sum opencode-linux-x64.tar.gz install.ps1 install.sh > SHA256SUMS.txt)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Linux x64 archive includes the complete Nix runtime closure. Install Nix first, then run install.sh.
            Windows/macOS native archives are not built by this workflow; install.ps1 supports separately supplied Windows ZIPs.
          files: |
            dist/opencode-linux-x64.tar.gz
            dist/SHA256SUMS.txt
            dist/install.ps1
            dist/install.sh
