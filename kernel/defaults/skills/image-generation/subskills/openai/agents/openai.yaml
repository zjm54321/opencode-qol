interface:
  display_name: "Image Gen"
  short_description: "Generate or edit images for websites, games, and more"
  icon_small: "./assets/imagegen-small.svg"
  icon_large: "./assets/imagegen.png"
  default_prompt: "Follow the parent image-generation skill and use OpenCode's native experimental_image_generate tool. Label reference roles, preserve edit invariants, and issue one authorized call per requested image. Normally omit model; resolve an explicitly requested model or variant through the image model catalog. Wait for the automatic completion notice, then read the saved image. Use only native tool inputs and report the actual saved path or actionable failure."
